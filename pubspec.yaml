name: taxi_app
description: Integrated Smart Taxi App System - Flutter Implementation
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.0.0
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  socket_io_client: ^2.0.0
  
  # Real-time Communication
  web_socket_channel: ^2.4.0
  
  # Geolocation & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.0
  location: ^5.0.1
  
  # Database
  sqflite: ^2.3.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  firebase_database: ^10.2.0
  
  # Authentication & Security
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  
  # Payment Gateway
  stripe_flutter: ^10.0.0
  
  # UI & Design
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  
  # Utilities
  intl: ^0.19.0
  logger: ^2.0.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.0
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  firebase_messaging: ^14.7.0
  
  # Rating & Reviews
  flutter_rating_bar: ^4.0.1
  
  # Dialog & Alerts
  fluttertoast: ^8.2.0
  awesome_dialog: ^3.1.0
  
  # Phone Authentication
  firebase_phone_auth_handler: ^5.0.0
  pinput: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
